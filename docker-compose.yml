services:
  livekit-server:
    build:
      context: ./livekit-server
      dockerfile: Dockerfile
    container_name: livekit-server
    ports:
      - "7880:7880"      # HTTP/WebSocket for signaling
      - "7881:7881"      # TCP fallback
      - "7882:7882/udp"  # UDP for WebRTC media
      - "50000-50100:50000-50100/udp"  # Additional UDP port range for multiple connections
    networks:
      - livekit-network
    restart: unless-stopped

  livekit-web:
    build:
      context: ./livekit-web
      dockerfile: Dockerfile
    container_name: livekit-web
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devkey_secret_32chars_minimum_required_for_security
      - LIVEKIT_URL=ws://localhost:7880
      - NEXT_PUBLIC_LIVEKIT_URL=ws://localhost:7880
    depends_on:
      - livekit-server
    networks:
      - livekit-network
    restart: unless-stopped

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: ai-agent
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devkey_secret_32chars_minimum_required_for_security
      - GOOGLE_API_KEY=AIzaSyB8CieZrd_FmAZRJJjB7q1KT06gnx7FY8U
    depends_on:
      - livekit-server
    networks:
      - livekit-network
    restart: unless-stopped

networks:
  livekit-network:
    driver: bridge
